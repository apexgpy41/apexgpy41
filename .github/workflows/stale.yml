name: Mark Stale Issues and Pull Requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: 60
          days-before-close: 14

          stale-issue-label: stale
          stale-pr-label: stale

          stale-issue-message: >
            This issue has been automatically marked as stale because it has had
            no recent activity. If there is still work to do, please comment to
            keep it open.

          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has had no recent activity.

          close-issue-message: >
            This issue was automatically closed after being marked stale.

          close-pr-message: >
            This pull request was automatically closed after being marked stale.

          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security